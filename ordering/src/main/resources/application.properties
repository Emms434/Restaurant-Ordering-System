spring.application.name=ordering

# Every value below uses ${ENV_VAR:default}: the default works for local
# development, and deployments (Docker Compose, Elastic Beanstalk) override it
# with environment variables, so no secrets are hard-coded for production.

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:restaurant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:restaurant}

# Flyway owns the schema. Hibernate only checks that the entities match it
# (validate) and never alters tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Close the DB session when the service method returns (not at the end of the
# HTTP request). Anything lazy must be loaded inside a @Transactional method.
spring.jpa.open-in-view=false

# Runs db/migration/V*__*.sql in order on startup, once each.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
